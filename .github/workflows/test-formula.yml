name: Test Homebrew formula

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    steps:
      - name: Install from the public tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install naomijnguyen/bootwitch/bootwitch
      - name: Run the formula test
        run: brew test naomijnguyen/bootwitch/bootwitch
      - name: Open the installed command guide
        run: |
          "$(brew --prefix)/bin/bootwitch" help
