name: Test Homebrew formula

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install from the checked-out tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew tap naomijnguyen/bootwitch "$GITHUB_WORKSPACE"
          brew install naomijnguyen/bootwitch/bootwitch
      - name: Run the formula test
        run: brew test naomijnguyen/bootwitch/bootwitch
      - name: Open the installed command guide
        run: |
          "$(brew --prefix)/bin/bootwitch" help
